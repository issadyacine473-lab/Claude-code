<!DOCTYPE html>
<html lang="fr">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"></head>
<body style="margin:0;padding:0;background-color:#f1f5f9;font-family:'Segoe UI',Arial,sans-serif;">
<table width="100%" cellpadding="0" cellspacing="0" style="background:#f1f5f9;padding:30px 0;">
  <tr><td align="center">
  <table width="620" cellpadding="0" cellspacing="0" style="max-width:620px;width:100%;">

    <!-- HEADER -->
    <tr><td style="background:linear-gradient(135deg,#1e293b 0%,#334155 60%,#475569 100%);border-radius:16px 16px 0 0;padding:36px 40px 28px;text-align:center;">
      <p style="margin:0 0 4px;font-size:11px;color:#94a3b8;letter-spacing:4px;text-transform:uppercase;font-weight:700;">Lundi — Nouvelle semaine</p>
      <h1 style="margin:0;font-size:28px;color:#ffffff;font-weight:300;letter-spacing:-0.5px;">Résumé <strong style="font-weight:700;">Email</strong></h1>
      <p style="margin:10px 0 0;font-size:14px;color:#cbd5e1;">{{DATE}}</p>
      <div style="margin:20px auto 0;width:40px;height:2px;background:linear-gradient(90deg,#3b82f6,#06b6d4);border-radius:2px;"></div>
    </td></tr>

    <!-- STATS -->
    <tr><td style="background:#ffffff;padding:28px 40px;border-left:1px solid #e2e8f0;border-right:1px solid #e2e8f0;">
      <table width="100%" cellpadding="0" cellspacing="0">
        <tr>
          <td align="center" style="width:33%;padding:0 6px;">
            <div style="border:2px solid #e2e8f0;border-radius:12px;padding:18px 10px;">
              <p style="margin:0;font-size:36px;font-weight:700;color:#1e293b;">{{TOTAL}}</p>
              <p style="margin:4px 0 0;font-size:10px;color:#94a3b8;text-transform:uppercase;letter-spacing:1.5px;">Reçus</p>
            </div>
          </td>
          <td align="center" style="width:33%;padding:0 6px;">
            <div style="border:2px solid #bbf7d0;border-radius:12px;padding:18px 10px;background:#f0fdf4;">
              <p style="margin:0;font-size:36px;font-weight:700;color:#15803d;">{{CONSERVES}}</p>
              <p style="margin:4px 0 0;font-size:10px;color:#4ade80;text-transform:uppercase;letter-spacing:1.5px;">Conservés</p>
            </div>
          </td>
          <td align="center" style="width:33%;padding:0 6px;">
            <div style="border:2px solid #fee2e2;border-radius:12px;padding:18px 10px;background:#fef2f2;">
              <p style="margin:0;font-size:36px;font-weight:700;color:#dc2626;">{{SUPPRIMES}}</p>
              <p style="margin:4px 0 0;font-size:10px;color:#f87171;text-transform:uppercase;letter-spacing:1.5px;">Traités</p>
            </div>
          </td>
        </tr>
      </table>
    </td></tr>

    <!-- ALERT -->
    {{ALERT_BLOCK}}

    <!-- SECTION TITRE -->
    <tr><td style="background:#ffffff;padding:20px 40px 8px;border-left:1px solid #e2e8f0;border-right:1px solid #e2e8f0;">
      <p style="margin:0;font-size:10px;color:#3b82f6;text-transform:uppercase;letter-spacing:3px;font-weight:700;border-bottom:2px solid #eff6ff;padding-bottom:10px;">Emails importants</p>
    </td></tr>

    <!-- EMAIL ITEMS -->
    {{EMAIL_ITEMS}}

    <!-- ARCHIVES -->
    <tr><td style="background:#ffffff;padding:20px 40px 8px;border-left:1px solid #e2e8f0;border-right:1px solid #e2e8f0;">
      <p style="margin:0;font-size:10px;color:#94a3b8;text-transform:uppercase;letter-spacing:3px;font-weight:700;border-bottom:1px solid #f1f5f9;padding-bottom:10px;">Archivés / Supprimés — {{NB_ARCHIVES}} emails</p>
    </td></tr>
    {{ARCHIVE_TABLE}}

    <!-- FOOTER -->
    <tr><td style="background:linear-gradient(135deg,#1e293b,#334155);border-radius:0 0 16px 16px;padding:22px 40px;text-align:center;border-top:3px solid #3b82f6;">
      <p style="margin:0 0 3px;font-size:12px;color:#94a3b8;">Assistant Email · Claude AI · Yacine Issad</p>
      <p style="margin:0;font-size:11px;color:#475569;">{{DATE}} · 17h00</p>
    </td></tr>

  </table>
  </td></tr>
</table>
</body>
</html>
